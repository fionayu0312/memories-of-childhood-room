<html lang="en">
  <!-- Tutorial modal popup structure referenced from W3Schools CSS Modal tutorial.
  https://www.w3schools.com/howto/howto_css_modals.asp-->
  
<head>
  <meta charset="UTF-8">
  <title>Home Memory</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #1a1008; font-family: sans-serif; }

    /* 首页 */
    #home {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #home h1 {
      font-family: 'IM Fell English', serif;
      font-size: 52px;
      color: #f0e6d3;
      margin-bottom: 12px;
      text-align: center;
    }
    #home p {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 20px;
      color: #a89070;
      margin-bottom: 48px;
    }
    #home .hint {
      font-size: 13px;
      color: #5a4020;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-family: 'Playfair Display', serif;
    }

    /* 教程弹窗 */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal-overlay.active { display: flex; }
    #modal-box {
      background: #1a1008;
      border: 0.5px solid #5a4020;
      padding: 48px 40px;
      max-width: 460px;
      width: 90%;
      text-align: center;
    }
    #modal-box h2 {
      font-family: 'IM Fell English', serif;
      font-size: 28px;
      color: #f0e6d3;
      margin-bottom: 8px;
    }
    #modal-box .modal-divider {
      width: 60px;
      height: 1px;
      background: #5a4020;
      margin: 16px auto;
    }
    #modal-box p {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 15px;
      color: #a89070;
      line-height: 1.8;
      margin-bottom: 12px;
    }
    #modal-box .modal-steps {
      text-align: left;
      margin: 24px 0;
    }
    #modal-box .modal-steps div {
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      color: #c8b090;
      padding: 8px 0;
      border-bottom: 0.5px solid #2a1a08;
      letter-spacing: 0.5px;
    }
    #modal-box .modal-steps span {
      color: #5a4020;
      margin-right: 10px;
    }
    #modal-enter {
      background: transparent;
      border: 0.5px solid #c8b090;
      color: #f0e6d3;
      font-family: 'IM Fell English', serif;
      font-size: 16px;
      padding: 12px 32px;
      cursor: pointer;
      margin-top: 24px;
      letter-spacing: 1px;
    }
    #modal-enter:hover { background: rgba(200,176,144,0.1); }

    /* 选择房间 */
    #room-select {
      display: none;
      min-height: 100vh;
      background: #1a1008;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 32px;
    }
    #room-select .rs-title {
      font-family: 'Playfair Display', serif;
      font-size: 13px;
      letter-spacing: 4px;
      color: #a89070;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    #room-select .rs-subtitle {
      font-family: 'IM Fell English', serif;
      font-style: italic;
      font-size: 32px;
      color: #f0e6d3;
      margin-bottom: 40px;
    }
    .rs-divider {
      width: 120px;
      height: 1px;
      background: #5a4020;
      margin: 0 auto 40px;
    }
    .rs-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 320px;
    }
    .rs-btn {
      background: transparent;
      border: 0.5px solid #5a4020;
      color: #c8b090;
      font-family: 'IM Fell English', serif;
      font-size: 16px;
      padding: 14px 24px;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.5px;
    }
    .rs-btn:hover {
      border-color: #c8b090;
      color: #f0e6d3;
      background: rgba(200,176,144,0.05);
    }
    .rs-num {
      font-size: 11px;
      letter-spacing: 2px;
      color: #5a4020;
      min-width: 20px;
    }
    #back-home {
      margin-top: 40px;
      background: transparent;
      border: none;
      color: #5a4020;
      font-family: 'IM Fell English', serif;
      font-size: 13px;
      cursor: pointer;
      letter-spacing: 1px;
    }
    #back-home:hover { color: #a89070; }
  </style>
</head>
<body>

  <!-- 首页 -->
  <div id="home">
    <h1>Memories of the Childhood Room</h1>
    <p>A place about memory</p>
    <div class="hint">Click anywhere to enter</div>
  </div>

  <!-- Tutorial modal popup Structure referenced from W3Schools CSS Modal tutorial:
  https://www.w3schools.com/howto/howto_css_modals.asp -->
  <div id="modal-overlay">
    <div id="modal-box">
      <h2>How to explore</h2>
      <div class="modal-divider"></div>
      <div class="modal-steps">
        <div><span>01</span> Click on an object to hear a memory left behind</div>
        <div><span>02</span> Have voice come out</div>
        <div><span>03</span> Choose to record your own memory to replace it, or just leave the last memory.</div>
      </div>
      <button id="modal-enter">Enter the house →</button>
    </div>
  </div>

  <!-- 选择房间 -->
  <div id="room-select">
    <p class="rs-title">Memories of the Childhood Room</p>
    <p class="rs-subtitle">Choose a room</p>
    <div class="rs-divider"></div>
    <div class="rs-grid">
      <button class="rs-btn" onclick="window.location.href='living.html'"><span class="rs-num">01</span> Living Room</button>
      <button class="rs-btn" onclick="window.location.href='bedroom.html'"><span class="rs-num">02</span> Bedroom</button>
      <button class="rs-btn" onclick="window.location.href='kitchen.html'"><span class="rs-num">03</span> Kitchen</button>
      <button class="rs-btn" onclick="window.location.href='living2.html'"><span class="rs-num">04</span> Livingroom2</button>
      <button class="rs-btn" onclick="window.location.href='bathroom.html'"><span class="rs-num">05</span> Bathroom</button>
    </div>
    <button id="back-home">← Back</button>
  </div>

<script>
  const home = document.getElementById('home')
  const roomSelect = document.getElementById('room-select')
  const modalOverlay = document.getElementById('modal-overlay')

  // home click
  home.onclick = function() {
    modalOverlay.classList.add('active')
  }

  // Enter → into the room
  document.getElementById('modal-enter').onclick = function(e) {
    e.stopPropagation()
    modalOverlay.classList.remove('active')
    home.style.display = 'none'
    roomSelect.style.display = 'flex'
  }

  // 选房间back → 首页
  document.getElementById('back-home').onclick = function(e) {
    e.stopPropagation()
    roomSelect.style.display = 'none'
    home.style.display = 'flex'
  }

  // 如果URL有#select，自动显示选择房间
  if (window.location.hash === '#select') {
    home.style.display = 'none'
    roomSelect.style.display = 'flex'
  }
</script>

</body>
</html>
