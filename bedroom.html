<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bedroom</title>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; }

 #room {
  height: 100vh;
  width: 100vw;
  position: relative;
  background-image: url("images/bedroom.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  background-color: black;
  overflow: hidden;
}

    .hotspot { position: absolute; cursor: pointer; }

    /* 调试颜色，位置确认后删掉background那行 */
   #bed    { width: 36%; height: 46%; left: 26%; bottom: 8%; transform: rotate(-13deg); transform-origin: bottom left;}
#pillow { width: 10%; height: 42%; right: 20%; top: 20%; transform: rotate(-30deg); transform-origin: bottom left; }
#chair  { width: 5%; height: 23%; left: 22%; top: 11%; transform: rotate(-23deg); transform-origin: bottom left; }
#bag    { width: 3%; height: 12%; left: 28%; top: 18%; transform: rotate(-23deg); transform-origin: bottom left;}
#desk   { width: 14%; height: 20%; left: 47%; top: 0%; }
#shelf  { width: 2%; height: 30%; right:54%; top: 0%; }
#plant  { width: 5%;  height: 6%; left: 16%;  top: 11%;  }
#knob   { width: 3%;  height: 3%;  left: 14%;  bottom: 35%;}

   #popup {
  display: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: #1a1008;
  border: 0.5px solid #5a4020;
  padding: 32px;
  border-radius: 0;
  text-align: center;
  z-index: 100;
  width: 320px;
  font-family: 'IM Fell English', serif;
}
#popup p { 
  font-size: 16px; 
  color: #a89070; 
  margin-bottom: 16px; 
  font-style: italic;
  line-height: 1.6;
}
.popup-btn { 
  font-family: 'IM Fell English', serif;
  font-size: 14px; 
  padding: 10px 20px; 
  margin: 6px; 
  border-radius: 0; 
  border: 0.5px solid #5a4020; 
  cursor: pointer; 
  background: transparent;
  color: #c8b090;
  letter-spacing: 0.5px;
}
.popup-btn:hover { border-color: #c8b090; color: #f0e6d3; }
#popup-record { border-color: #c8b090; color: #f0e6d3; }
#popup-play   { border-color: #3B6D11; color: #3B6D11; display: none; }
#popup-skip   { color: #5a4020; border-color: #2a1a08; }
#recording-indicator { display: none; color: #e24b4a; font-size: 13px; margin: 8px 0; font-family: sans-serif; }
  </style>
</head>
<body>
  <div id="room">
    <button id="back-btn" onclick="window.location.href='index.html#select'">← Back</button>

    <div id="bed"    class="hotspot"></div>
    <div id="pillow" class="hotspot"></div>
    <div id="chair"  class="hotspot"></div>
    <div id="bag"    class="hotspot"></div>
    <div id="desk"   class="hotspot"></div>
    <div id="shelf"  class="hotspot"></div>
    <div id="plant"  class="hotspot"></div>
    <div id="knob" class="hotspot"></div>

    <div id="popup">
      <p id="popup-text">memory</p>
      <div id="recording-indicator">● recording...</div>
      <button class="popup-btn" id="popup-play">▶ last memory</button>
      <button class="popup-btn" id="popup-record">🎙 Share my memory</button>
      <button class="popup-btn" id="popup-skip">Skip</button>
    </div>
  </div>

<script>
  const popup = document.getElementById('popup')
  const popupText = document.getElementById('popup-text')

  const memories = {
    bed:    { text: 'Soft bed sheets', audio: null },
    pillow: { text: 'Sometimes there was always one pillow on the floor. ', audio: null },
    chair:  { text: 'My throne', audio: null },
    bag:    { text: 'Just casually threw the bag on the ground', audio: null },
    desk:   { text: 'Messy desk, but I can still find my own things.', audio: null },
    shelf:  { text: 'The novels I read while daydreaming while doing my homework are all kept here.', audio: null },
    plant:  { text: 'Cactus-like plants', audio: null },
    knob: { text: 'This bed originally had four shelves, but it was inconvenient for cleaning, so it was reduced to a single sphere shape.', audio: null },
}
document.getElementById('knob').onclick = function(e) { e.stopPropagation(); openPopup('knob') }

  // 每个房间的唯一ID，每个房间改成不同的名字
const ROOM_ID = 'bedroom' // bathroom/living/bedroom/kitchen/study

// 页面加载时读取localStorage里的录音
Object.keys(memories).forEach(function(item) {
  const saved = localStorage.getItem(ROOM_ID + '_' + item)
  if (saved) {
    // 把base64转回blob
    fetch(saved).then(r => r.blob()).then(blob => {
      memories[item].audio = blob
    })
  }
})
  let currentItem = null
  let mediaRecorder = null
  let audioChunks = []

  function openPopup(item) {
    currentItem = item
    const m = memories[item]
    popupText.innerText = m.text
    document.getElementById('recording-indicator').style.display = 'none'
    document.getElementById('popup-record').style.display = 'inline'
    document.getElementById('popup-record').innerText = '🎙 Share my memory'
    document.getElementById('popup-skip').innerText = 'Skip'
    document.getElementById('popup-play').style.display = m.audio ? 'inline' : 'none'
    popup.style.display = 'block'
  }

  document.getElementById('popup-play').onclick = function(e) {
    e.stopPropagation()
    if (memories[currentItem].audio) {
      const reader = new FileReader()
      reader.onload = function(e) { new Audio(e.target.result).play() }
      reader.readAsDataURL(memories[currentItem].audio)
    }
  }

  document.getElementById('popup-record').onclick = async function(e) {
    e.stopPropagation()
    const btn = document.getElementById('popup-record')
    const indicator = document.getElementById('recording-indicator')

    if (!mediaRecorder || mediaRecorder.state === 'inactive') {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true })
      const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4'
      mediaRecorder = new MediaRecorder(stream, { mimeType })
      audioChunks = []

      mediaRecorder.ondataavailable = function(e) {
        if (e.data.size > 0) audioChunks.push(e.data)
      }
      mediaRecorder.onstop = function() {
      const blob = new Blob(audioChunks, { type: mimeType })
      memories[currentItem].audio = blob
  // 保存到localStorage
      const reader = new FileReader()
      reader.onload = function(e) {
      localStorage.setItem(ROOM_ID + '_' + currentItem, e.target.result)
  }
  reader.readAsDataURL(blob)
  document.getElementById('popup-play').style.display = 'inline'
  document.getElementById('popup-skip').innerText = 'Done'
  indicator.style.display = 'none'
  btn.innerText = '🎙 New recording'
}

      mediaRecorder.start(100)
      indicator.style.display = 'block'
      btn.innerText = '⏹ Finish'

    } else if (mediaRecorder.state === 'recording') {
      mediaRecorder.stop()
    }
  }

  document.getElementById('popup-skip').onclick = function(e) {
    e.stopPropagation()
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop()
    popup.style.display = 'none'
  }

  document.getElementById('bed').onclick    = function(e) { e.stopPropagation(); openPopup('bed') }
  document.getElementById('pillow').onclick = function(e) { e.stopPropagation(); openPopup('pillow') }
  document.getElementById('chair').onclick  = function(e) { e.stopPropagation(); openPopup('chair') }
  document.getElementById('bag').onclick    = function(e) { e.stopPropagation(); openPopup('bag') }
  document.getElementById('desk').onclick   = function(e) { e.stopPropagation(); openPopup('desk') }
  document.getElementById('shelf').onclick  = function(e) { e.stopPropagation(); openPopup('shelf') }
  document.getElementById('plant').onclick  = function(e) { e.stopPropagation(); openPopup('plant') }
</script>

</body>
</html>
